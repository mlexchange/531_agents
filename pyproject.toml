[project]
name = "bl531"
version = "0.1.1"
description = "bl531 - Osprey Agent Application"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.6",
    "starlette==0.41.3",
    "uvicorn==0.47.0",
    "aiohttp==3.13.5",
    "litellm==1.85.0",
    "pydantic-ai==0.4.3",
    "pydantic-graph==0.4.3",
    "osprey-framework==0.9.1",
    "tiled==0.2.9",
    "stamina==26.1.0",
    "dask==2026.3.0",
    "xraydb==4.5.8",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
