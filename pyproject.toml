[project]
name = "bl531"
version = "0.1.1"
description = "bl531 - Osprey Agent Application"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.137.1",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "aiohttp==3.14.1",
    "litellm==1.89.1",
    "pydantic-ai==1.107.0",
    "pydantic-graph==1.107.0",
    "osprey-framework==2026.6.0",
    "tiled==0.2.12",
    "stamina==26.1.0",
    "dask==2026.6.0",
    "xraydb==4.5.8",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
